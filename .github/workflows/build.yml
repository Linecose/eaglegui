name: Build EagleGUI Native Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Shkarko kodin (Checkout)
      uses: actions/checkout@v4

    - name: Shto Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalo Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.2'
        target: 'desktop'

    - name: Instalo varësitë e Node.js
      run: npm install

    - name: Kompilo me cmake-js
      run: npx cmake-js compile --release

    - name: Mblidh DLL-të e Qt me windeployqt
      run: |
          # Gjej ku u instalua Qt dhe ekzekuto windeployqt mbi skedarin tonë .node
          # (ose vendose skedarin .node në një dosje të përkohshme bashkë me varësitë)
          mkdir -p release
          cp build/Release/eaglegui_native.node release/
          
          # Përdorim windeployqt për të tërhequr automatikisht DLL-të e duhura
          # Rruga e Qt gjehet nga variablat e mjedisit në runner-in e GitHub
          windeployqt --qmldir . release/eaglegui_native.node

    - name: Ngarko Artifacts (ZIP i plotë)
      uses: actions/upload-artifact@v4
      with:
          name: eaglegui-full-package
          path: release/

    - name: Ruaj skedarin binar (.node)
      uses: actions/upload-artifact@v4
      with:
        name: eaglegui-binary
        path: build/Release/*.node
